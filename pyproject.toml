# Test tooling config for the vocab app.
# SAM (template.yaml + per-function requirements.txt) is unaffected by this file.

[tool.pytest.ini_options]
testpaths = ["src/tests"]
# Put the function packages (src/) and the shared Lambda layer (src/layer/python)
# on sys.path so tests import handlers and layer modules the same way the deployed
# code does — no per-test sys.path.append hacks needed.
# scripts/ is included so the seeded_vocab_lists fixture can build its items with
# the same code the real seed script uses.
pythonpath = ["src", "src/layer/python", "src/user_pool_triggers", "scripts"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
# Current coverage is ~75%; fail the build if it regresses below this floor.
fail_under = 70
